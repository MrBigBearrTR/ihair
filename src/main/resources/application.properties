spring.application.name=ihair

# PostgreSQL baglantisi (PostgreSQL yoksa: --spring.profiles.active=dev ile H2 kullan)
# PostgreSQL Baglanti
spring.datasource.url=jdbc:postgresql://localhost:5432/ihair
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=ihair-super-secret-key-must-be-at-least-256-bits-long-for-hmac
jwt.access-token-expiration=86400000
jwt.refresh-token-expiration=604800000
